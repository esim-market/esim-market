services:
  esim-market-ui-dev:
    profiles: ["dev"]
    image: esim-market-ui:local
    build:
      context: ./esim-market-ui
      dockerfile: Dockerfiles/esim-market-ui
      target: frontend
    command:
      ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./esim-market-ui/frontend:/app
      - esim-market-ui-node-modules:/app/node_modules
    ports:
      - "5001:5173"
    networks:
      - esim-market-network

  esim-market-ui:
    profiles: ["prod"]
    build:
      context: ./esim-market-ui
      dockerfile: Dockerfiles/esim-market-ui
      target: production
    ports:
      - "5001:80"
    networks:
      - esim-market-network

  esim-market-backend-api:
    image: esim-market-backend-api:local
    build:
      context: ./esim-market-backend
      dockerfile: Dockerfiles/esim-market-backend-api
    command:
      - "backend.gate.integration.main:app"
      - "--reload"
      - "--reload-delay"
      - "3"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    env_file:
      - .env/dev/api.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MONGO_DATABASE: "esim_market"
      MONGO_ENDPOINT: "esim-market-mongodb:27017"
      MONGO_USER: "app_db_user"
      REDIS_CORE_CLUSTER_CONFIG__HOST: "esim-market-redis"
      REDIS_CORE_CLUSTER_CONFIG__PORT: "6379"
      REDIS_CORE_CLUSTER_CONFIG__CONNECTION_POOL_MAX_CONNECTIONS: "100"
      REDIS_CORE_CLUSTER_CONFIG__KIND: "STAND_ALONE"
    ports:
      - "5002:8080"
    volumes:
      - ./esim-market-backend/backend:/home/backend
    depends_on:
      esim-market-mongodb:
        condition: service_healthy
      esim-market-redis:
        condition: service_healthy
    networks:
      - esim-market-network

  esim-market-backend-job:
    image: esim-market-backend-job:local
    build:
      context: ./esim-market-backend
      dockerfile: Dockerfiles/esim-market-backend-job
    env_file:
      - .env/dev/fastapi.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MONGO_URI: "mongodb://app_db_user:app_db_user_pass@localhost:27017/?authSource=esim_market"
      MONGO_DATABASE: "esim_market"
      REDIS_CORE_CLUSTER_CONFIG__HOST: "esim-market-redis"
      REDIS_CORE_CLUSTER_CONFIG__PORT: "6379"
      REDIS_CORE_CLUSTER_CONFIG__PASSWORD: "t8xzdruIOY"
      REDIS_CORE_CLUSTER_CONFIG__CONNECTION_POOL_MAX_CONNECTIONS: "100"
      REDIS_CORE_CLUSTER_CONFIG__KIND: "STAND_ALONE"
    volumes:
      - ./esim-market-backend/backend:/home/backend
    depends_on:
      esim-market-mongodb:
        condition: service_healthy
      esim-market-redis:
        condition: service_healthy
    networks:
      - esim-market-network

  esim-market-mongodb:
    image: mongodb/mongodb-community-server:8.3-ubi8-slim
    env_file:
      - .env/dev/mongodb.env
    environment:
      MONGODB_INITDB_DATABASE: "esim_market"
      MONGODB_INITDB_ROOT_USERNAME: "mongodb_root"
      MONGODB_APP_USERNAME: "app_db_user"
    ports:
      - "27017:27017"
    volumes:
      - esim-market-mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGODB_INITDB_ROOT_USERNAME\" --password \"$$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - esim-market-network

  esim-market-redis:
    image: bitnami/redis:latest
    env_file:
      - .env/dev/redis.env
    ports:
      - "6379:6379"
    volumes:
      - esim-market-redis-data:/bitnami/redis/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - esim-market-network

networks:
  esim-market-network:
    driver: bridge

volumes:
  esim-market-mongodb-data:
  esim-market-redis-data:
  esim-market-ui-node-modules:
